run_id: lap_libero
run_root_dir: playground/Checkpoints
seed: 42
wandb_entity: your_wandb_entity
wandb_project: llavavla
is_debug: false
version_id: "0.21"

# LAP (Language-Action Pre-training) — VLM-only stage.
# The VLM learns to speak low-level actions as language (cross-entropy).
# Continuous control is expected from a separate action expert added later.
framework:
  name: QwenLAP
  qwenvl:
    # Plain instruct model — LAP needs NO action special tokens.
    base_vlm: ./playground/Pretrained_models/Qwen3-VL-4B-Instruct
    attn_implementation: flash_attention_2
  action_model:
    action_model_type: LAP_text
    action_dim: 7
    # Matches data_config action_indices=range(8); textualize uses this chunk.
    action_horizon: 8
    max_new_tokens: 64

datasets:
  vlm_data:
    dataset_py: vlm_datasets
    dataformat: llava_json
    dataset_use: sharegpt4v_coco
    eval_dataset: sharegpt4v_coco
    data_flatten: false
    base_interval: 2
    max_pixels: 307200
    min_pixels: 784
    model_max_length: 2048
    model_type: qwen2.5vl
    per_device_batch_size: 4

  vla_data:
    dataset_py: lerobot_datasets
    data_root_dir: playground/Datasets/LEROBOT_LIBERO_DATA
    data_mix: libero_all # libero_goal
    action_type: delta_qpos
    sequential_step_sampling: False
    # No CoT_prompt: LAP uses the plain task instruction as the user prompt.
    per_device_batch_size: 16
    load_all_data_for_training: true
    video_backend: torchvision_av

trainer:
  max_train_steps: 30000
  num_warmup_steps: 2000
  save_interval: 5000
  eval_interval: 100
  learning_rate:
    base: 2.0e-05
  lr_scheduler_type: cosine_with_min_lr
  scheduler_specific_kwargs:
    min_lr: 1.0e-06
  # Train the VLM fully — LAP supervises the VLM's language head.
  freeze_modules: ''
  loss_scale:
    vla: 1.0
    vlm: 0.1
  max_grad_norm: 1.0
  weight_decay: 0.0
  logging_frequency: 10
  gradient_clipping: 1.0
  gradient_accumulation_steps: 4
  gradient_checkpointing: true

  optimizer:
    name: AdamW
    betas: [0.9, 0.95]
    eps: 1.0e-08
    weight_decay: 1.0e-08
